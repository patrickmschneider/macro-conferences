&lt;section&gt;&lt;h2&gt;About the conference&lt;/h2&gt;&lt;p&gt;The conference will meet in person on the University of Miami campus in Coral Gables on February 5, 2027 . The day-long academic program will be followed by the Henry Lecture, and then a reception and dinner.&lt;/p&gt;&lt;/section&gt;
&lt;section id=&quot;cfp&quot;&gt;&lt;h2&gt;Call for papers&lt;/h2&gt;&lt;p&gt;The Department of Economics at the University of Miami Business School invites submissions for Miami Macro 2027. We welcome theoretical, empirical, and quantitative contributions to macroeconomics, broadly defined.&lt;/p&gt;
&lt;ul&gt;&lt;li&gt;Monetary policy, fiscal policy, and their interactions&lt;/li&gt;&lt;li&gt;Macroeconomics and financial markets, including financial stability&lt;/li&gt;&lt;/ul&gt;
&lt;p class=&quot;deadline-label&quot;&gt;Submission deadline&lt;/p&gt;&lt;p class=&quot;deadline&quot;&gt;December 15, 2026&lt;/p&gt;&lt;p&gt;Send your paper (preferred) or extended abstract to the organiser by email.&lt;/p&gt;&lt;/section&gt;&lt;/body&gt;&lt;/html&gt;"></div></div><footer>Google Sites Report abuse</footer></body></html>
